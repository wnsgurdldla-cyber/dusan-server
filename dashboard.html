<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>두산 카운트 매니저 대시보드</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { background-color: #121824; color: white; font-family: 'Pretendard', sans-serif; display: flex; justify-content: center; padding: 20px; }
    .card { background: #1e2430; padding: 24px; border-radius: 12px; width: 100%; max-width: 420px; text-align: center; }
    .dusan-box { font-size: 36px; font-weight: bold; color: #ffe600; margin: 15px 0; }
    .section { background: #0b0f19; padding: 12px; border-radius: 8px; margin-bottom: 12px; text-align: left; }
    .section label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 4px; }
    input { width: 93%; padding: 8px; border-radius: 6px; border: 1px solid #2b3445; background: #121824; color: #fff; font-size: 14px; }
    .btn-group { display: flex; gap: 6px; margin-top: 6px; }
    button { flex: 1; padding: 10px; background: #ffe600; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    .reset-btn { width: 100%; background: #ef4444; color: white; margin-top: 15px; }
    .history { max-height: 120px; overflow-y: auto; text-align: left; margin-top: 15px; border-top: 1px solid #2b3445; padding-top: 10px; font-size: 13px; }
  </style>
</head>
<body>
<div class="card">
  <h2>두산 카운트 대시보드</h2>
  <div class="dusan-box" id="dusanDisplay">0 두산</div>
  <div style="margin-bottom:15px;">총 누적 별풍선 : <span id="totalDisplay">0</span> 개</div>

  <div class="section">
    <label>별풍선 추가</label>
    <div class="btn-group">
      <input type="number" id="balloonInput" placeholder="별풍선 개수" onkeydown="if(event.key==='Enter') sendBalloons()">
      <button onclick="sendBalloons()">입력</button>
    </div>
  </div>

  <div class="section">
    <label>미션 목표 설정 (방송 화면 실시간 표시)</label>
    <input type="text" id="m300" placeholder="300두산 미션 (예: 시그니처 댄스)" style="margin-bottom:6px;">
    <input type="text" id="m400" placeholder="400두산 미션 (예: 애교 송)">
    <button onclick="sendMissions()" style="width:100%; margin-top:6px; background:#3b82f6; color:white;">미션 업데이트</button>
  </div>

  <div class="history" id="historyList"></div>
  <button class="reset-btn" onclick="resetData()">전체 리셋</button>
</div>

<script>
  const socket = io();

  socket.on('updateData', (data) => {
    document.getElementById('dusanDisplay').innerText = `${data.dusan} 두산`;
    document.getElementById('totalDisplay').innerText = data.totalBalloons.toLocaleString();
    if(data.m300 !== undefined) document.getElementById('m300').value = data.m300;
    if(data.m400 !== undefined) document.getElementById('m400').value = data.m400;

    const historyList = document.getElementById('historyList');
    historyList.innerHTML = '';
    (data.history || []).slice().reverse().forEach((item, index) => {
      historyList.innerHTML += `<div>+ ${item.toLocaleString()} 개 (${data.history.length - index}회차)</div>`;
    });
  });

  function sendBalloons() {
    const input = document.getElementById('balloonInput');
    const val = parseInt(input.value);
    if (val > 0) {
      socket.emit('addBalloons', val);
      input.value = '';
    }
  }

  function sendMissions() {
    const m300 = document.getElementById('m300').value;
    const m400 = document.getElementById('m400').value;
    socket.emit('updateMissions', { m300, m400 });
  }

  function resetData() {
    if (confirm('모든 기록을 리셋하시겠습니까?')) {
      socket.emit('resetData');
    }
  }
</script>
</body>
</html>
</script>
</body>
</html>
