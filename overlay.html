<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>두산 오버레이</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: 'Pretendard', sans-serif; }
    
    .card {
      width: 340px;
      background: rgba(18, 24, 36, 0.92);
      border: 2px solid #2b3445;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      color: white;
      position: relative;
      transition: all 0.5s ease;
    }

    .title { font-size: 13px; color: #94a3b8; }
    .dusan { font-size: 40px; font-weight: 800; color: #ffe600; text-shadow: 0 0 10px rgba(255,230,0,0.4); margin: 2px 0; }
    .total { font-size: 13px; color: #cbd5e1; margin-bottom: 12px; }

    /* 현재 진행 미션 전광판 스타일 */
    .target-banner {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid #3b82f6;
      border-radius: 8px;
      padding: 10px;
      box-shadow: inset 0 0 10px rgba(59, 130, 246, 0.2);
    }
    .target-header { font-size: 11px; color: #60a5fa; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
    .target-title { font-size: 15px; font-weight: bold; color: #ffffff; margin-top: 3px; word-break: keep-all; }

    /* 돌파 축하 애니메이션 */
    .celebrate {
      animation: pulse 0.8s infinite alternate;
      border-color: #ffe600 !important;
      box-shadow: 0 0 40px rgba(255, 230, 0, 0.9) !important;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.04); }
    }

    .banner {
      display: none;
      position: absolute;
      top: -42px;
      left: 0;
      width: 100%;
      background: #ffe600;
      color: #000;
      font-weight: 800;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

<div class="card" id="mainCard">
  <div class="banner" id="goalBanner">🎉 미션 달성! 🎉</div>
  <div class="title">[ 현재 달성 두산 ]</div>
  <div class="dusan" id="dusanDisplay">0 두산</div>
  <div class="total">총 누적 별풍선 : <span id="totalDisplay">0</span> 개</div>

  <div class="target-banner">
    <div class="target-header" id="targetHeader">NEXT MISSION</div>
    <div class="target-title" id="targetTitle">도전할 미션을 등록하세요</div>
  </div>
</div>

<script>
  const socket = io();

  // 화려한 팡파레 브라스 멜로디 연주 함수
  function playFanfare() {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();

    // 트럼펫 팡파레 멜로디 (도-미-솔-도... 웅장한 연주 코드)
    const notes = [
      { f: 523.25, t: 0.0, d: 0.15 }, // C5
      { f: 523.25, t: 0.15, d: 0.15 },// C5
      { f: 523.25, t: 0.30, d: 0.15 },// C5
      { f: 659.25, t: 0.45, d: 0.40 },// E5
      { f: 783.99, t: 0.85, d: 0.20 },// G5
      { f: 1046.50, t: 1.05, d: 0.80 } // C6 (하이라이트)
    ];

    notes.forEach(n => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      
      osc.type = 'triangle'; // 브라스 관악기 느낌 나는 파형
      osc.frequency.setValueAtTime(n.f, ctx.currentTime + n.t);

      // 볼륨 및 울림 볼륨 조정
      gain.gain.setValueAtTime(0, ctx.currentTime + n.t);
      gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + n.t + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + n.t + n.d);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(ctx.currentTime + n.t);
      osc.stop(ctx.currentTime + n.t + n.d);
    });
  }

  socket.on('updateData', (data) => {
    document.getElementById('dusanDisplay').innerText = `${data.dusan} 두산`;
    document.getElementById('totalDisplay').innerText = Number(data.totalBalloons).toLocaleString();
    
    const header = document.getElementById('targetHeader');
    const title = document.getElementById('targetTitle');

    if (data.nextMission) {
      if (data.dusan >= data.nextMission.target) {
        header.innerText = "ALL MISSIONS CLEAR";
        header.style.color = "#10b981";
        title.innerText = "🏆 모든 미션을 달성했습니다!";
      } else {
        header.innerText = `NEXT GOAL: ${data.nextMission.target}두산`;
        header.style.color = "#60a5fa";
        title.innerText = data.nextMission.text || "미션 내용 없음";
      }
    } else {
      header.innerText = "MISSION";
      title.innerText = "설정된 미션이 없습니다.";
    }
  });

  socket.on('triggerGoal', (event) => {
    const card = document.getElementById('mainCard');
    const banner = document.getElementById('goalBanner');

    banner.innerText = `🎉 ${event.target}두산 달성: ${event.title} 🎉`;
    banner.style.display = 'block';
    card.classList.add('celebrate');
    
    playFanfare();

    setTimeout(() => {
      card.classList.remove('celebrate');
      banner.style.display = 'none';
    }, 6000);
  });
</script>
</body>
</html>
</body>
</html>
