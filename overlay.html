<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>두산 오버레이</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: 'Pretendard', sans-serif; }
    
    .card {
      width: 340px;
      background: rgba(18, 24, 36, 0.9);
      border: 2px solid #2b3445;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      color: white;
      position: relative;
      transition: all 0.5s ease;
    }

    .title { font-size: 13px; color: #94a3b8; }
    .dusan { font-size: 38px; font-weight: 800; color: #ffe600; text-shadow: 0 0 10px rgba(255,230,0,0.4); margin: 4px 0; }
    .total { font-size: 13px; color: #cbd5e1; margin-bottom: 10px; }

    .mission-box {
      background: rgba(0,0,0,0.4);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 12px;
      text-align: left;
      border: 1px solid rgba(255,255,255,0.1);
      max-height: 110px;
      overflow-y: auto;
    }
    .mission-item { display: flex; justify-content: space-between; margin: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 2px; }
    .m-tag { font-weight: bold; color: #ffb703; width: 75px; }
    .m-txt { flex: 1; text-align: right; color: #f1f5f9; }

    /* 돌파 축하 애니메이션 */
    .celebrate {
      animation: pulse 1s infinite alternate;
      border-color: #ffe600 !important;
      box-shadow: 0 0 35px rgba(255, 230, 0, 0.9) !important;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      100% { transform: scale(1.03); }
    }

    .banner {
      display: none;
      position: absolute;
      top: -40px;
      left: 0;
      width: 100%;
      background: #ffe600;
      color: #000;
      font-weight: 800;
      padding: 6px 0;
      border-radius: 6px;
      font-size: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

<div class="card" id="mainCard">
  <div class="banner" id="goalBanner">🎉 미션 달성! 🎉</div>
  <div class="title">[ 현재 달성 두산 ]</div>
  <div class="dusan" id="dusanDisplay">0 두산</div>
  <div class="total">총 누적 별풍선 : <span id="totalDisplay">0</span> 개</div>

  <div class="mission-box" id="missionDisplayContainer"></div>
</div>

<script>
  const socket = io();

  function playFanfare() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const notes = [261.63, 329.63, 392.00, 523.25];
    notes.forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.1, ctx.currentTime + idx * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 0.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + idx * 0.12);
      osc.stop(ctx.currentTime + idx * 0.12 + 0.4);
    });
  }

  socket.on('updateData', (data) => {
    document.getElementById('dusanDisplay').innerText = `${data.dusan} 두산`;
    document.getElementById('totalDisplay').innerText = Number(data.totalBalloons).toLocaleString();
    
    const container = document.getElementById('missionDisplayContainer');
    container.innerHTML = '';
    (data.missions || []).forEach(m => {
      container.innerHTML += `
        <div class="mission-item">
          <span class="m-tag">[${m.target}두산]</span>
          <span class="m-txt">${m.text || '-'}</span>
        </div>
      `;
    });
  });

  socket.on('triggerGoal', (event) => {
    const card = document.getElementById('mainCard');
    const banner = document.getElementById('goalBanner');

    banner.innerText = `🎉 ${event.target}두산 달성: ${event.title} 🎉`;
    banner.style.display = 'block';
    card.classList.add('celebrate');
    playFanfare();

    setTimeout(() => {
      card.classList.remove('celebrate');
      banner.style.display = 'none';
    }, 6000);
  });
</script>
</body>
</html>
