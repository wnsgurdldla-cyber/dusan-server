<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>두산 오버레이</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: 'Pretendard', sans-serif; }
    .card { width: 300px; background: rgba(18, 24, 36, 0.9); border: 2px solid #2b3445; border-radius: 12px; padding: 15px; text-align: center; color: white; }
    .title { font-size: 13px; color: #94a3b8; }
    .dusan { font-size: 36px; font-weight: bold; color: #ffe600; text-shadow: 0 0 10px rgba(255,230,0,0.4); margin: 5px 0; }
    .total { font-size: 13px; color: #cbd5e1; }
  </style>
</head>
<body>
<div class="card">
  <div class="title">[ 현재 달성 두산 ]</div>
  <div class="dusan" id="dusanDisplay">0 두산</div>
  <div class="total">총 누적 별풍선 : <span id="totalDisplay">0</span> 개</div>
</div>

<script>
  const socket = io();

  socket.on('updateData', (data) => {
    document.getElementById('dusanDisplay').innerText = `${data.dusan} 두산`;
    document.getElementById('totalDisplay').innerText = Number(data.totalBalloons).toLocaleString();
  });
</script>
</body>
</html>
